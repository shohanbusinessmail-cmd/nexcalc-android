name: Engine and app build
on:
  push:
    branches: [ "arena/aa8fb12a-nexcalc-android" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Engine tests and app build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew :core:math:test :app:assembleDebug :app:testDebugUnitTest --continue --stacktrace --no-daemon --console=plain 2>&1 | tee build.log
      - name: Summarise failures
        if: failure()
        run: |
          {
            echo "===== COMPILE ERRORS ====="
            grep -n "^e: " build.log | head -120 || true
            echo "===== TEST FAILURES ====="
            python3 - <<'PY'
            import glob, re, xml.etree.ElementTree as ET
            for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
                try:
                    root = ET.parse(path).getroot()
                except Exception as exc:
                    continue
                for case in root.iter('testcase'):
                    for node in list(case.findall('failure')) + list(case.findall('error')):
                        message = (node.get('message') or '').strip()
                        print(f"{case.get('classname')} > {case.get('name')}: {message[:900]}")
            PY
          } | tee -a build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            core/math/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Publish run log to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilogs
          cd /tmp/cilogs
          cp "$GITHUB_WORKSPACE/build.log" last-run.log
          git init -q
          git checkout -q -b ci-logs
          git add last-run.log
          git -c user.name="NEXCALC CI" -c user.email="ci@nexcalc.local" commit -q -m "CI log for ${GITHUB_SHA}"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" ci-logs
