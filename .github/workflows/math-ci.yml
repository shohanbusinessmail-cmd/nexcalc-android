name: Core Math CI

on:
  push:
    branches: [ "arena/aa8fb12a-nexcalc-android" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math:
    name: Engine build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run engine tests
        run: ./gradlew :core:math:test --stacktrace --no-daemon
      - name: Upload engine test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: core/math/build/reports/tests/test
          if-no-files-found: warn
