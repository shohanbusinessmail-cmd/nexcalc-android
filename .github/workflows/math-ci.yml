name: Core Math CI

on:
  push:
    branches: [ "arena/aa8fb12a-nexcalc-android" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  math:
    name: Engine build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run engine tests
        run: |
          set -o pipefail
          ./gradlew :core:math:test :app:assembleDebug --continue --stacktrace --no-daemon --console=plain 2>&1 | tee build.log
      - name: Summarise failing tests
        if: failure()
        run: |
          {
            echo "===== TEST FAILURES ====="
            grep -h -A8 "<failure" core/math/build/test-results/test/*.xml 2>/dev/null | head -400 || true
          } | tee -a build.log
      - name: Upload engine test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: core/math/build/reports/tests/test
          if-no-files-found: warn
      - name: Publish run log to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilogs
          cd /tmp/cilogs
          cp "$GITHUB_WORKSPACE/build.log" last-run.log
          git init -q
          git checkout -q -b ci-logs
          git add last-run.log
          git -c user.name="NEXCALC CI" -c user.email="ci@nexcalc.local" commit -q -m "CI log for ${GITHUB_SHA}"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" ci-logs
